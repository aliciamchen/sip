[project]
name = "saliva-inverse-planning"
version = "0.1.0"
description = "Computational cognitive models for inverse planning in social contexts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core scientific computing
    "numpy>=2.3.0",
    "scipy>=1.16.0",
    "pandas>=2.3.0",
    # JAX ecosystem
    "jax>=0.7.2",
    "jaxlib>=0.7.2",
    "optax>=0.2.6",
    "chex>=0.1.91",
    "ml-dtypes>=0.5.3",
    # Probabilistic programming
    "memo-lang>=1.2.4",
    # Visualization
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
    "pillow>=11.0.0",
    # Utilities (transitive deps, but pinning for reproducibility)
    "tqdm>=4.60.0",
    # LLM API client (used across model/lm/)
    "together>=2.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    # Local notebook exploration; nothing in the pipeline imports these.
    "ipython>=9.0.0",
    "ipykernel>=6.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The repo installs as an editable package (uv sync does this automatically),
# so scripts import the model code as `model.*` and the root modules
# (utils, study_registry, plot_style) by name.
# Editable matters: the code resolves data and outputs relative to its own
# location, so a copied (non-editable) install would look in site-packages.
[tool.hatch.build.targets.wheel]
only-include = [
    "model",
    "data_prep",
    "utils.py",
    "study_registry.py",
    "plot_style.py",
]
exclude = ["model/outputs"]

[tool.uv]
package = true


[tool.ruff.lint.per-file-ignores]
# plot_style and the schematic script set the matplotlib backend before
# importing pyplot, so their imports legitimately follow code (E402); the
# schematic script also uses `I` for the intimacy magnitude, the manuscript's
# own symbol (E741, like the counterbalancing generator's design-table names).
"plot_style.py" = ["E402"]
"figures/scripts/figure_schematic_plots.py" = ["E402", "E741"]
"experiments/build/counterbalancing.py" = ["E741"]
# The scenario scripts still insert experiments/build/ before importing its
# writer (experiments/ is not a package).
"experiments/scenarios*.py" = ["E402"]
# The memo DSL injects names (actor, observer, knows, chooses, ...) into its
# decorated functions at compile time, and its annotated `cast` locals are DSL
# syntax, so the undefined-name and unused-local rules misfire here.
"model/observers.py" = ["F821", "F842"]
"model/actors.py" = ["F821", "F842"]
# `attention_passed != True` is an elementwise pandas comparison; rewriting it
# to `is not True` (E712's fix) changes the semantics.
"data_prep/json_to_csv.py" = ["E712"]
