[project]
name = "saliva-inverse-planning"
version = "0.1.0"
description = "Computational cognitive models for inverse planning in social contexts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core scientific computing
    "numpy>=2.3.0",
    "scipy>=1.16.0",
    "pandas>=2.3.0",
    # JAX ecosystem
    "jax>=0.7.2",
    "jaxlib>=0.7.2",
    "optax>=0.2.6",
    "chex>=0.1.91",
    "ml-dtypes>=0.5.3",
    # Probabilistic programming
    "memo-lang>=1.2.4",
    # Visualization
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
    "pillow>=11.0.0",
    # Utilities (transitive deps, but pinning for reproducibility)
    "tqdm>=4.60.0",
    # LLM API client (used across model/lm/)
    "together>=2.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    # Local notebook exploration; nothing in the pipeline imports these.
    "ipython>=9.0.0",
    "ipykernel>=6.30.0",
]

[tool.uv]
package = false


[tool.ruff.lint]
# Scripts insert the repo root on sys.path before their intra-repo imports, so
# module-level imports legitimately follow code (E402).
extend-ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# The memo DSL injects names (actor, observer, knows, chooses, ...) into its
# decorated functions at compile time, and its annotated `cast` locals are DSL
# syntax, so the undefined-name and unused-local rules misfire here.
"model/observers.py" = ["F821", "F842"]
"model/actors.py" = ["F821", "F842"]
# `attention_passed != True` is an elementwise pandas comparison; rewriting it
# to `is not True` (E712's fix) changes the semantics.
"analysis/json_to_csv.py" = ["E712"]
# `I` is the intimacy magnitude, the manuscript's own symbol; `l`/`I` loop
# names in the counterbalancing generator mirror the design tables.
"figures/scripts/figure_schematic_plots.py" = ["E741"]
"experiments/build/counterbalancing.py" = ["E741"]
