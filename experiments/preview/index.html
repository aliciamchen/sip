<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trial preview — saliva inverse planning</title>

    <!-- Same jsPsych core + plugins as the real experiments (see
         ../food_inv_desire/index.html). jsPsych is never run() here; the plugin
         globals just need to exist so the studies' trial-builder functions can
         construct their trial objects, which this page then renders statically. -->
    <script src="https://unpkg.com/jspsych@8.2.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@2.0.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-slider-response@2.1.0"></script>

    <link
      href="https://unpkg.com/jspsych@8.2.2/css/jspsych.css"
      rel="stylesheet"
      type="text/css"
    />
    <!-- The shared experiment styles, so vignette/slider/two-slider markup
         renders exactly as participants see it. -->
    <link rel="stylesheet" href="../_lib/style.css" />

    <style>
      /* Preview chrome only — none of this affects the participant-facing
         markup, which is styled entirely by ../_lib/style.css above. */
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #1f2933;
        background: #eef1f4;
      }

      .preview-header {
        max-width: 980px;
        margin: 0 auto;
        padding: 24px 24px 8px 24px;
      }
      .preview-header h1 {
        font-size: 20px;
        margin: 0 0 4px 0;
      }
      .preview-header p {
        width: 100%;
        margin: 0;
        text-align: left;
        font-size: 13px;
        color: #52606d;
      }

      /* Sticky controls bar */
      .controls {
        position: sticky;
        top: 0;
        z-index: 10;
        background: #fff;
        border-bottom: 1px solid #cbd2d9;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        padding: 14px 24px;
      }
      .controls-inner {
        max-width: 980px;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        gap: 14px 22px;
        align-items: flex-end;
      }
      .control {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .control label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: #616e7c;
      }
      .control select {
        font-size: 14px;
        padding: 6px 8px;
        border: 1px solid #cbd2d9;
        border-radius: 6px;
        background: #fff;
        min-width: 150px;
      }

      /* "What's given / what's inferred" legend */
      .legend {
        max-width: 980px;
        margin: 18px auto 0 auto;
        padding: 0 24px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        font-size: 13px;
      }
      .legend .chip {
        padding: 4px 10px;
        border-radius: 999px;
        font-weight: 600;
      }
      .legend .given {
        background: #e3effd;
        color: #1c4e80;
      }
      .legend .inferred {
        background: #fef0e3;
        color: #8a4b16;
      }
      .legend .chip span {
        font-weight: 400;
        opacity: 0.85;
      }

      /* Screen cards */
      .cards {
        max-width: 980px;
        margin: 8px auto 40px auto;
        padding: 0 24px;
      }
      .card {
        background: #fff;
        border: 1px solid #d2d8df;
        border-radius: 12px;
        margin: 22px 0;
        overflow: hidden;
      }
      .card-label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #fff;
        background: #52606d;
        padding: 6px 14px;
      }
      .card-label.stage-intro {
        background: #7b8794;
      }
      .card-label.stage-prior {
        background: #2f80c2;
      }
      .card-label.stage-posterior {
        background: #2f9e6f;
      }
      .card-label.stage-memory {
        background: #9b6dc0;
      }
      .card-body {
        padding: 18px 24px 28px 24px;
      }
      /* The participant-facing markup centers itself; let it fill the card. */
      .card-body #jspsych-content,
      .card-body .preview-screen {
        padding: 0;
      }

      /* The shared slider markup uses a fixed 900px track whose endpoint labels
         are centered ON the track tips (transform: translateX(±50%) in
         _lib/style.css), so each overhangs its end. In the live experiment the
         slider sits in a full-width content area with room to spare; inside the
         narrower preview card (which clips via overflow:hidden for its rounded
         corners) that overhang would be cut off. Sizing the track to a fraction
         of the card leaves a margin on each side big enough for the overhang, so
         the endpoint labels stay fully visible at any window width. Applies to
         both the two-slider forms (1b/2b) and the single-slider widget (1a/2a),
         which reuses the same markup. */
      .card .two-slider-track {
        width: 70% !important;
      }

      /* Static single-slider rendering (mirrors _lib/two-slider.js markup so the
         shared .two-slider-* styles apply). */
      .preview-screen .preview-button {
        display: block;
        margin: 24px auto 0 auto;
        padding: 8px 22px;
        font-size: 14px;
        border: 1px solid #adb5bd;
        border-radius: 6px;
        background: #f1f3f5;
        color: #495057;
        cursor: default;
      }

      /* Full scenario data panel */
      .scenario-panel {
        max-width: 980px;
        margin: 0 auto 60px auto;
        padding: 0 24px;
      }
      .scenario-panel details {
        background: #fff;
        border: 1px solid #d2d8df;
        border-radius: 12px;
        padding: 6px 18px;
      }
      .scenario-panel summary {
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        padding: 8px 0;
      }
      .scenario-panel table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
        margin: 10px 0 14px 0;
      }
      .scenario-panel th {
        text-align: left;
        vertical-align: top;
        padding: 6px 14px 6px 0;
        width: 200px;
        color: #52606d;
        font-weight: 600;
        white-space: nowrap;
      }
      .scenario-panel td {
        text-align: left;
        vertical-align: top;
        padding: 6px 0;
        border-bottom: 1px solid #eceff2;
      }
      .scenario-panel .group-head td {
        font-weight: 700;
        color: #1f2933;
        border-bottom: none;
        padding-top: 16px;
      }

      .preview-error {
        max-width: 980px;
        margin: 30px auto;
        padding: 16px 24px;
        background: #fdecea;
        border: 1px solid #f5c6c2;
        border-radius: 8px;
        color: #842029;
      }
    </style>
  </head>

  <body>
    <div class="preview-header">
      <h1>Trial preview</h1>
      <p>
        Pick a study, scenario, and condition to see exactly what a participant
        would see on that trial. Screens are rendered from the same trial-builder
        code the live experiments use, so the wording here always matches the
        real study. Nothing is recorded.
      </p>
    </div>

    <div class="controls">
      <div class="controls-inner" id="controls"></div>
    </div>

    <div class="legend" id="legend"></div>

    <div class="cards" id="cards"></div>

    <div class="scenario-panel" id="scenario-panel"></div>

    <script type="module" src="preview.js"></script>
  </body>
</html>
