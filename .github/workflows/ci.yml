# Minimal CI: the Python side only (uv sync + make test). The R/Quarto
# analysis stage is not covered here because restoring the renv library is too
# heavy for CI for now.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync
      - name: Run tests
        run: make test
