# Minimal CI: uv sync + make test + the generated-experiment-asset check.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync
      - name: Run tests
        run: make test
      - name: Check generated experiment assets are in sync with their source
        run: make check-experiments
